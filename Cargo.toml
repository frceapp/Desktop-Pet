[package]
name = "desktop-pet"
version = "1.1.0"
edition = "2021"
description = "Chiikawa, Hachiware and Usagi walking around on top of your windows (Native Rust)"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gltf = "1"
image = { version = "0.25", default-features = false, features = ["png", "gif", "webp", "jpeg", "bmp", "ico"] }
tiny-skia = "0.11"
resvg = "0.44"
glam = "0.29"
fastrand = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
