# Builds the Windows binary bundle and attaches it to a GitHub Release whenever a version tag
# (v1.0.0, v1.1.0, ...) is pushed. The tag must match "version" in Cargo.toml.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
      - name: Package Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Desktop-Pet | Out-Null
          Copy-Item target/release/desktop-pet.exe dist/Desktop-Pet/
          Copy-Item -Recurse characters dist/Desktop-Pet/
          Copy-Item -Recurse chiikawa_and_friends dist/Desktop-Pet/
          Compress-Archive -Path dist/Desktop-Pet/* -DestinationPath "dist/Desktop-Pet-Windows-x64-${{ github.ref_name }}.zip"
      - name: Publish release
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/Desktop-Pet-Windows-x64-*.zip --title "Desktop Pet ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
