# Builds the Windows installer and attaches it to a GitHub Release whenever a version tag
# (v1.0.0, v1.1.0, ...) is pushed. The tag must match "version" in package.json.
name: Release installer

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win --publish never
      # One release per tag, holding just the installer. (Letting electron-builder publish
      # uploads its files in parallel, which made two releases for the same tag.)
      - name: Publish the installer as a release
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/Desktop-Pet-Setup-*.exe --title "Desktop Pet ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
